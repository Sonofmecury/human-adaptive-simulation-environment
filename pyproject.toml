[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-adaptive-sim"
version = "0.1.0"
description = "A Python simulation of a human-adaptive task environment that adjusts difficulty, pacing, and challenge level based on simulated user performance metrics."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "matplotlib~=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest~=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulation*"]
